# Прод-запуск игрового сервера. Порт наружу не выставляется: снаружи мир
# доступен только через nginx (wss://realms.neuraldeep.ru/ws).
services:
  realms-ws:
    build: .
    image: realms-ws:${REALMS_TAG:-latest}
    container_name: realms-ws
    restart: unless-stopped
    ports: ['127.0.0.1:8790:8790']
    volumes: ['realms-data:/data']
    environment:
      PORT: 8790
      DB: /data/realms.db
      # Внутри контейнера сервер слушает все интерфейсы (по умолчанию только 127.0.0.1),
      # а наружу его пускает только публикация порта на 127.0.0.1.
      HOST: 0.0.0.0
      # Соединения приходят только через nginx хоста, он перезаписывает X-Forwarded-For.
      TRUST_PROXY: '1'
    # Профили сохраняются при остановке: даём время на выход по SIGTERM.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

volumes:
  realms-data:
    name: realms-data
